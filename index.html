<!doctype html>
<html lang="ko" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <meta name="theme-color" content="#f2f4f6" />
    <meta name="description" content="Plan urgent work around actual team availability with SkillRelay." />
    <title>SkillRelay · Workforce planning</title>
    <script>
      try {
        var saved = localStorage.getItem('skillrelay.theme')
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
